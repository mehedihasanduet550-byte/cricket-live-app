<!DOCTYPE html>
<html>
<head>
    <title>Group</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm-modal.css') }}">
</head>
<body>


<!-- 🔥 Navigation -->
<div class="nav">
    <a href="/live">Back</a>
    <a href="/">Home</a>
    <a href="/stats">Scorecard</a>
    <a href="/team">Team Info</a>
    <a href="/fixture">Match Fixture</a>
    <a href="/points">Points Table</a>
    <a href="/comments">Comments</a>

    {% include "partials/nav_admin.html" %}
</div>
<h2 class="fixture-title">Group</h2>

<!-- 🔥 ADD -->
<form action="/add-group-team" method="POST">
<div class="team-card row-card add-box">
    <input type="text" name="team" placeholder="Team name,group (a/b)" required>
    <button type="submit">Add</button>
</div>
</form>

<!-- 🔥 LIST -->
{% for t in teams %}
<div class="team-card row-card player-row">

    <div class="left">
        {{ loop.index }}. {{ t.name }} , {{ t.group }}
    </div>

    <div class="right actions">

        <!-- EDIT -->
        <button type="button"
        onclick="openEdit({{loop.index0}}, `{{t.name}},{{t.group}}`)"
        class="edit-btn">Edit</button>

        <!-- DELETE -->
        <a href="/delete-group-team/{{loop.index0}}"
           onclick="return confirm('Delete?')"
           class="delete-btn">Delete</a>

    </div>

</div>
{% endfor %}

<!-- 🔥 MODAL -->
<div id="editModal" class="modal">
    <div class="team-card row-card add-box">
        <form id="editForm" method="POST">
            <input type="text" name="team" id="editInput" required>
            <button type="submit">Update</button>
        </form>
    </div>
</div>

<script>
function openEdit(index, value) {

    const modal = document.getElementById("editModal");
    const input = document.getElementById("editInput");
    const form = document.getElementById("editForm");

    input.value = value;
    form.action = "/edit-group-team/" + index;

    modal.classList.add("show");
}

window.onclick = function(e) {
    const modal = document.getElementById("editModal");
    if (e.target === modal) {
        modal.classList.remove("show");
    }
}
</script>

    <script src="{{ url_for('static', filename='css/js/confirm-modal.js') }}"></script>
</body>
</html>
