
<!DOCTYPE html>
<html>

<head>
    <title>Stats</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm-modal.css') }}">

    <style>
        :root {
            --team-card-opacity: 0.28;
        }

        body {
            background: linear-gradient(
                160deg,
                #0a0e2a 0%,
                #1a0b3b 50%,
                #06242c 100%
            ) fixed !important;

            min-height: 100vh;
        }

        /* Background Glow - Team Info Style */
        body::before {
            content: "";
            position: fixed;
            inset: -10%;
            z-index: -1;
            pointer-events: none;

            background:
                radial-gradient(circle at 12% 10%, rgba(255, 64, 200, .20), transparent 38%),
                radial-gradient(circle at 90% 22%, rgba(0, 229, 255, .18), transparent 36%),
                radial-gradient(circle at 18% 62%, rgba(255, 171, 0, .14), transparent 38%),
                radial-gradient(circle at 88% 82%, rgba(124, 77, 255, .22), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(0, 230, 118, .12), transparent 36%);

            animation: fxDrift 26s ease-in-out infinite alternate;
        }

        @keyframes fxDrift {
            from {
                transform: translate3d(-2%, -1%, 0) scale(1);
            }

            to {
                transform: translate3d(2%, 2%, 0) scale(1.08);
            }
        }

        /* Page Title */
        .fixture-title {
            text-align: center;
            color: #ffffff;
            margin: 28px 0 30px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(0, 255, 220, 0.35);
        }

        /* Cards Container */
        .matches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
            width: 90%;
            max-width: 1100px;
            margin: 0 auto 40px;
        }

        /* Stats Cards - Same Team Info Glass Style */
        .matches .team-card {
            --hue: 155;

            position: relative;
            overflow: hidden;
            cursor: pointer;

            background:
                linear-gradient(
                    rgba(8, 10, 28, .12),
                    rgba(8, 10, 28, .12)
                ),
                linear-gradient(
                    150deg,
                    hsla(var(--hue), 92%, 60%, var(--team-card-opacity)),
                    hsla(var(--hue), 88%, 42%, calc(var(--team-card-opacity) * .58)) 58%,
                    hsla(var(--hue), 92%, 52%, calc(var(--team-card-opacity) * .78))
                ) !important;

            -webkit-backdrop-filter: blur(18px) saturate(160%);
            backdrop-filter: blur(18px) saturate(160%);

            border: 1px solid hsla(var(--hue), 90%, 88%, .50);
            border-radius: 18px;

            padding: 30px 20px;
            min-height: 90px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                inset 0 1.5px 0 rgba(255, 255, 255, .55),
                inset 0 -14px 24px hsla(var(--hue), 80%, 15%, .30),
                0 6px 0 -2px hsla(var(--hue), 65%, 24%, .65),
                0 20px 34px -8px hsla(var(--hue), 80%, 10%, .55);

            transition:
                box-shadow .28s ease,
                transform .18s ease;
        }

        /* Glass Shine */
        .matches .team-card::before {
            content: "";
            position: absolute;
            left: -20%;
            right: -20%;
            top: -30%;
            height: 75%;

            background: linear-gradient(
                115deg,
                rgba(255, 255, 255, .20),
                rgba(255, 255, 255, .03) 55%,
                rgba(255, 255, 255, 0)
            );

            transform: rotate(-8deg);
            pointer-events: none;
            z-index: 0;
        }

        /* Bottom Color Glow */
        .matches .team-card::after {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            bottom: -30px;
            height: 60px;

            background: radial-gradient(
                closest-side,
                hsla(var(--hue), 90%, 62%, .34),
                transparent
            );

            filter: blur(8px);
            pointer-events: none;
            z-index: 0;
        }

        /* 3D Hover */
        .matches .team-card:hover {
            transform: translateY(-3px);

            box-shadow:
                inset 0 1.5px 0 rgba(255, 255, 255, .65),
                inset 0 -14px 24px hsla(var(--hue), 80%, 15%, .30),
                0 9px 0 -2px hsla(var(--hue), 65%, 24%, .65),
                0 28px 44px -8px hsla(var(--hue), 80%, 10%, .72);
        }

        /* Click / Press Effect */
        .matches .team-card:active {
            transform: translateY(5px) scale(.98);

            box-shadow:
                inset 0 1px 5px rgba(0, 0, 0, .25),
                0 2px 0 -1px hsla(var(--hue), 65%, 24%, .65),
                0 5px 10px rgba(0, 0, 0, .30);
        }

        /* Full Card Clickable */
        .matches .team-card a {
            color: #ffffff !important;
            text-decoration: none !important;

            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: .2px;
            line-height: 1.5;

            text-align: center;

            display: flex;
            align-items: center;
            justify-content: center;

            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            padding: 12px;
            box-sizing: border-box;

            cursor: pointer;
            z-index: 2;

            text-shadow:
                0 1px 2px #000,
                0 2px 5px rgba(0, 0, 0, .85);
        }

        /* Individual Card Colors */
        .matches .team-card:nth-child(1) {
            --hue: 155;
        }

        .matches .team-card:nth-child(2) {
            --hue: 215;
        }

        .matches .team-card:nth-child(3) {
            --hue: 275;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .matches {
                grid-template-columns: 1fr;
                width: 90%;
                gap: 16px;
            }

            .matches .team-card {
                min-height: 85px;
                padding: 24px 15px;
            }

            .matches .team-card a {
                font-size: 17px;
            }

            .fixture-title {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="nav">
        <a href="/">Home</a>
        <a href="/stats">Scorecard</a>
        <a href="/team">Team Info</a>
        <a href="/fixture">Match Fixture</a>
        <a href="/points">Points Table</a>
        <a href="/comments">Comments</a>

        {% include "partials/nav_admin.html" %}
    </div>

    <h2 class="fixture-title">Match Stats</h2>

    <div class="matches">

        <div class="team-card row-card center-card">
            <a href="/most-runs">🏏 Most Runs</a>
        </div>

        <div class="team-card row-card center-card">
            <a href="/most-wicket">🎯 Most Wickets</a>
        </div>

        <div class="team-card row-card center-card">
            <a href="/all-match">📁 All Matches</a>
        </div>

    </div>

    <script>
        fetch("/heartbeat");

        setInterval(() => {
            fetch("/heartbeat");
        }, 5000);
    </script>

    <script src="{{ url_for('static', filename='css/js/confirm-modal.js') }}"></script>

</body>

</html>
