<!DOCTYPE html>
<html>

<head>
    <title>Most Runs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm-modal.css') }}">

    <style>
        :root {
            --team-card-opacity: 0.28;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;

            background: linear-gradient(160deg,
                    #0a0e2a 0%,
                    #1a0b3b 50%,
                    #06242c 100%) fixed;
        }

        /* Animated Background */
        body::before {
            content: "";
            position: fixed;
            inset: -10%;
            z-index: -1;
            pointer-events: none;

            background:
                radial-gradient(circle at 12% 10%, rgba(255, 64, 200, .20), transparent 38%),
                radial-gradient(circle at 90% 22%, rgba(0, 229, 255, .18), transparent 36%),
                radial-gradient(circle at 18% 62%, rgba(255, 171, 0, .14), transparent 38%),
                radial-gradient(circle at 88% 82%, rgba(124, 77, 255, .22), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(0, 230, 118, .12), transparent 36%);

            animation: runsDrift 26s ease-in-out infinite alternate;
        }

        @keyframes runsDrift {
            from {
                transform: translate3d(-2%, -1%, 0) scale(1);
            }

            to {
                transform: translate3d(2%, 2%, 0) scale(1.08);
            }
        }

/* Page Title */
        .title {
            text-align: center;
            margin: 20px 15px;
            font-size: 22px;
            font-weight: bold;
            color: white;

            text-shadow:
                0 2px 5px rgba(0, 0, 0, .8),
                0 0 15px rgba(0, 229, 255, .25);
        }

        /* Main Container */
        .table-box {
            width: 96%;
            margin: 15px auto 45px;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            display: grid;
            grid-template-columns: 2fr repeat(7, 1fr);

            padding: 12px;

            background: linear-gradient(90deg,
                    #ff2f2f,
                    #dd2476,
                    #1fa2ff);

            color: white;
            font-weight: bold;
            border-radius: 12px;
            text-align: center;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, .3),
                inset 0 1px 0 rgba(255, 255, 255, .35);
        }

        .header div:first-child {
            text-align: left;
            padding-left: 10px;
        }

        /* Individual Glass Player Card */
        .row {
            --card-color: 0, 220, 180;

            position: relative;
            display: grid;
            grid-template-columns: 2fr repeat(7, 1fr);

            padding: 11px;
            margin: 9px 0;

            background: linear-gradient(150deg,
                    rgba(var(--card-color), var(--team-card-opacity)),
                    rgba(var(--card-color), 0.12) 58%,
                    rgba(var(--card-color), 0.22)) !important;

            border: 1px solid rgba(var(--card-color), .55);
            border-radius: 12px;

            color: white;
            align-items: center;
            text-align: center;

            -webkit-backdrop-filter: blur(18px) saturate(160%);
            backdrop-filter: blur(18px) saturate(160%);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .30),
                inset 0 -8px 15px rgba(0, 0, 0, .15),
                0 5px 0 -2px rgba(var(--card-color), .45),
                0 12px 22px rgba(0, 0, 0, .30);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                filter .25s ease;
        }

        /* Mint Green and Other Card Colors */
        .row.color-1 {
            --card-color: 67, 233, 123;
        }

        .row.color-2 {
            --card-color: 56, 249, 215;
        }

        .row.color-3 {
            --card-color: 0, 160, 255;
        }

        .row.color-4 {
            --card-color: 190, 90, 255;
        }

        .row.color-5 {
            --card-color: 255, 110, 150;
        }

        .row.color-6 {
            --card-color: 255, 171, 0;
        }

        .row.color-7 {
            --card-color: 100, 220, 100;
        }

        .row.color-8 {
            --card-color: 80, 210, 255;
        }

        /* Hover Effect */
        .row:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .45),
                0 8px 0 -2px rgba(var(--card-color), .55),
                0 20px 30px rgba(0, 0, 0, .45);
        }

        /* First Player Highlight */
        .row.top {
            font-weight: bold;
            border-left: 5px solid gold;
        }

        /* Player Name */
        .row div:first-child {
            text-align: left;
            padding-left: 10px;
            font-weight: bold;
        }

        /* Runs Highlight */
        .row div:nth-child(4) b {
            color: #43ffd2;
            font-size: inherit;
            text-shadow: 0 0 8px rgba(67, 255, 210, .45);
        }

        /* Responsive */
        @media(max-width: 900px) {
            .table-box {
                width: 94%;
            }
        }

        @media(max-width: 600px) {
            .table-box {
                width: 98%;
                margin-top: 12px;
            }

            .header,
            .row {
                font-size: 11px;
                padding: 8px 5px;
            }

            .header div:first-child {
                padding-left: 3px;
            }

            .row div:first-child {
                padding-left: 3px;
            }
        }

        @media(prefers-reduced-motion: reduce) {
            body::before {
                animation: none;
            }

            .row {
                transition: none;
            }
        }
        .row::before,
        .points-row::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;

            background: linear-gradient(
                170deg,
                rgba(255,255,255,.22) 0%,
                rgba(255,255,255,.08) 42%,
                transparent 43%,
                transparent 100%
            );
        }

        .row,
        .points-row {
            overflow: hidden;
        }

        /* ==========================================
           NAVIGATION (same as every other page / style.css)
        ========================================== */

        .nav {
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            background: linear-gradient(45deg, #4facfe, #00f2fe, #43e97b);
            scrollbar-width: none;
            scroll-behavior: smooth;
            font-family: Arial, sans-serif;
        }

        .nav::-webkit-scrollbar {
            display: none;
        }

        .nav a {
            flex: 1 0 14.28%;
            text-align: center;
            padding: 10px;
            color: rgb(1, 0, 0);
            text-decoration: none;
            font-weight: bold;
            font-family: Arial, sans-serif;
            font-size: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            box-sizing: border-box;
        }

        .nav a:last-child {
            border-right: none;
        }

        @media (max-width: 768px) {
            .nav a {
                display: flex;
                flex-direction: column;
                text-align: center;
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <div class="nav">
        <a href="/stats">Back</a>
        <a href="/">Home</a>
        <a href="/stats">Scorecard</a>
        <a href="/team">Team Info</a>
        <a href="/fixture">Match Fixture</a>
        <a href="/points">Points Table</a>
        <a href="/comments">Comments</a>

        {% include "partials/nav_admin.html" %}
    </div>

    <!-- PAGE TITLE -->
    <div class="title">🏏 Most Runs</div>

    <!-- MOST RUNS TABLE -->
    <div class="table-box">

        <!-- HEADER -->
        <div class="header">
            <div>Player</div>
            <div>M</div>
            <div>Inns</div>
            <div>Runs</div>
            <div>AVG</div>
            <div>SR</div>
            <div>4s</div>
            <div>6s</div>
        </div>

        <!-- PLAYER CARDS -->
        {% for p in players %}

        <div class="row color-{{ (loop.index0 % 8) + 1 }} {% if loop.index == 1 %}top{% endif %}">

            <div>{{ p.player }}</div>

            <div>{{ p.match }}</div>

            <div>{{ p.inns }}</div>

            <div><b>{{ p.runs }}</b></div>

            <div>{{ p.avg }}</div>

            <div>{{ p.sr }}</div>

            <div>{{ p.fours }}</div>

            <div>{{ p.sixes }}</div>

        </div>

        {% endfor %}

    </div>

    <!-- HEARTBEAT -->
    <script>
        fetch("/heartbeat");

        setInterval(() => {
            fetch("/heartbeat");
        }, 5000);
    </script>

    <!-- CONFIRM MODAL -->
    <script src="{{ url_for('static', filename='css/js/confirm-modal.js') }}"></script>

</body>

</html>
