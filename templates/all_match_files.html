<!DOCTYPE html>
<html>
<head>
    <title>All Match Files</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm-modal.css') }}">
</head>
<body>

<div class="nav">
    <a href="/live">Back</a>
    <a href="/">Home</a>
    <a href="/stats">Scorecard</a>
    <a href="/team">Team Info</a>
    <a href="/fixture">Match Fixture</a>
    <a href="/points">Points Table</a>
    <a href="/comments">Comments</a>

    {% include "partials/nav_admin.html" %}
</div>

<h2 class="fixture-title">All Match Files</h2>

<div class="team-grid">

    {% for m in matches %}
    <a href="/match-editor?file={{ m.file }}" class="team-card row-card">

        <!-- 🔴 TEAM 1 -->
        <div class="team-side" style="display:flex; flex-direction:column; align-items:center;">
            <img loading="lazy" src="{{ url_for('static', filename='images/teams/' + m.team1 + '.webp') }}">
         
            <span>{{ m.team1 }}</span>
        </div>

        <!-- 🆚 -->
        <div class="vs-text">VS</div>

        <!-- 🔵 TEAM 2 -->
        <div class="team-side" style="display:flex; flex-direction:column; align-items:center;">
            <img loading="lazy" src="{{ url_for('static', filename='images/teams/' + m.team2 + '.webp') }}">
            <span>{{ m.team2 }}</span>
        </div>

    </a>
    {% endfor %}

</div>

    <script src="{{ url_for('static', filename='css/js/confirm-modal.js') }}"></script>
</body>
</html>
