<!DOCTYPE html>
<html>
<head>
    <title>Most Wickets</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin:0;
            font-family: Arial;
            background: linear-gradient(135deg, #1d2b64, #f8cdda);
        }

       .nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background: linear-gradient(45deg, #4facfe, #00f2fe, #43e97b);
            /*background: linear-gradient(45deg, #667eea, #764ba2);*/
            overflow-y: visible;
            scrollbar-width: none;
        }

        .nav::-webkit-scrollbar {
            display: none;
        }

        .nav a{
            flex:1;
            padding:10px;
            text-align:center;
            text-decoration:none;
            color:black;
            font-weight:bold;
            border-right: 1px solid rgba(255,255,255,0.4);
        }
        /* TITLE */
        .title{
            text-align:center;
            margin:15px;
            font-size:22px;
            font-weight:bold;
            color:white;
        }

        /* TABLE */
        .table-box{
            margin:10px;
        }

        .header{
            display:grid;
            grid-template-columns: 2fr repeat(6, 1fr);
            padding:12px;
            background: linear-gradient(90deg, #ff512f, #dd2476, #1fa2ff);
            color:white;
            font-weight:bold;
            border-radius:12px;
            text-align:center;
        }

        .header div:first-child{
            text-align:left;
            padding-left:10px;
        }

        .row{
            display:grid;
            grid-template-columns: 2fr repeat(6, 1fr);
            padding:10px;
            margin:6px 0;
            background: rgba(255,255,255,0.08);
            border-radius:10px;
            color:white;
            align-items:center;
            text-align:center;
        }

        .row div:first-child{
            text-align:left;
            padding-left:10px;
        }

        .row:hover{
            background: rgba(0,150,255,0.25);
        }

       /* TOP 4 */
        .top{
            background: rgba(255,255,255,0.08);
            color:white;
            font-weight:bold;
             border-left: 5px solid gold;
        }

        /* MOBILE */
        @media(max-width:768px){
            .header,.row{
                font-size:11px;
                padding:8px;
            }
        }

    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/confirm-modal.css') }}">
</head>

<body>

<!-- NAV -->
<div class="nav">
    <a href="/stats">Back</a>
    <a href="/">Home</a>
    <a href="/stats">Scorecard</a>
    <a href="/team">Team Info</a>
    <a href="/fixture">Match Fixture</a>
    <a href="/points">Points Table</a>
    <a href="/comments">Comments</a>
</div>

<!-- TITLE -->
<div class="title">🏏 Most Wickets</div>

<!-- TABLE -->
<div class="table-box">

    <!-- HEADER -->
    <div class="header">
        <div>Player</div>
        <div>M</div>
        <div>Overs</div>
        <div>Balls</div>
        <div>Wkts</div>
        <div>Avg</div>
        <div>Runs</div>
    </div>

    <!-- DATA -->
    {% for p in players %}
    <div class="row {% if loop.index == 1 %}top{% endif %}">
        <div>{{ p.player }}</div>
        <div>{{ p.match }}</div>
        <div>{{ p.overs }}</div>
        <div>{{ p.balls }}</div>
        <div><b>{{ p.wickets }}</b></div>
        <div>{{ p.avg }}</div>
        <div>{{ p.runs }}</div>
    </div>
    {% endfor %}

</div>
<script>

fetch("/heartbeat")

setInterval(()=>{

fetch("/heartbeat")

},5000)

</script>
    <script src="{{ url_for('static', filename='css/js/confirm-modal.js') }}"></script>
</body>
</html>
